<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>&#9996; The Hippy Dippy Trail &mdash; London to Bangkok</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#1a1a2e; color:#eee; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
#header { background:linear-gradient(135deg,#2d1b00,#4a2e00); padding:10px 16px; border-bottom:2px solid #f6a623; flex-shrink:0; }
#header h1 { font-size:1.25rem; color:#f6a623; letter-spacing:1px; }
#header .sub { font-size:0.78rem; color:#ccc; margin-top:2px; }
#main { display:flex; flex:1; overflow:hidden; }
#map { flex:1; }
#sidebar { width:280px; background:#111827; display:flex; flex-direction:column; border-left:1px solid #374151; overflow:hidden; }
#leg-list { flex:1; overflow-y:auto; padding:8px; }
#leg-list h3 { color:#f6a623; font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; padding:4px; }
.leg-card { background:#1f2937; border:1px solid #374151; border-radius:6px; padding:8px 10px; margin-bottom:6px; cursor:pointer; transition:all .2s; }
.leg-card:hover, .leg-card.active { border-color:#f6a623; background:#2d3748; }
.leg-card .leg-num { font-size:0.68rem; color:#f6a623; text-transform:uppercase; letter-spacing:1px; }
.leg-card .leg-route { font-size:0.9rem; font-weight:600; color:#f3f4f6; margin:2px 0; }
.leg-card .leg-meta { font-size:0.72rem; color:#9ca3af; }
#elev-panel { height:160px; background:#0f172a; border-top:1px solid #374151; padding:8px; flex-shrink:0; }
#elev-panel h4 { color:#f6a623; font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
#elev-chart-wrap { height:120px; }
.leaflet-popup-content-wrapper { background:#1f2937; border:1px solid #f6a623; color:#f3f4f6; }
.leaflet-popup-tip { background:#1f2937; }
.popup-icao { font-size:1rem; font-weight:700; color:#f6a623; }
.popup-detail { font-size:0.8rem; color:#9ca3af; margin-top:2px; }
</style>
</head>
<body>
<div id="header">
  <h1>&#9996; The Hippy Dippy Trail &mdash; London to Bangkok</h1>
  <div class="sub" id="subtitle">Loading...</div>
</div>
<div id="main">
  <div id="map"></div>
  <div id="sidebar">
    <div id="leg-list">
      <h3>Flight Legs</h3>
      <div id="cards"></div>
    </div>
    <div id="elev-panel">
      <h4 id="elev-title">Elevation Profile</h4>
      <div id="elev-chart-wrap"><canvas id="elev-chart"></canvas></div>
    </div>
  </div>
</div>
<script>
const PLANS = [{"departure": "EGLC", "destination": "EBBR", "waypoints": [{"icao": "EGLC", "lat": 51.505299, "lon": 0.055278, "type": "Airport"}, {"icao": "WP1", "lat": 51.514011, "lon": 0.719892, "type": "User"}, {"icao": "WP2", "lat": 51.426808, "lon": 1.028267, "type": "User"}, {"icao": "EGDH", "lat": 51.176125, "lon": 1.278014, "type": "Airport"}, {"icao": "WP3", "lat": 51.130108, "lon": 1.321564, "type": "User"}, {"icao": "LFAC", "lat": 50.962101, "lon": 1.95476, "type": "Airport"}, {"icao": "EBMO", "lat": 50.851285, "lon": 3.147669, "type": "Airport"}, {"icao": "EBBR", "lat": 50.901402, "lon": 4.48444, "type": "Airport"}], "distance_nm": 180.8, "leg": 1, "date": "2026-10-10", "filename": "Hippy Dippy Part 01 VFR London City (EGLC) to Brussels National (EBBR).pln"}, {"departure": "EBBR", "destination": "LFPB", "waypoints": [{"icao": "EBBR", "lat": 50.901402, "lon": 4.48444, "type": "Airport"}, {"icao": "EBA4V", "lat": 50.841789, "lon": 4.382036, "type": "Airport"}, {"icao": "WP1", "lat": 50.851278, "lon": 4.353125, "type": "User"}, {"icao": "EBBA", "lat": 50.469514, "lon": 3.838767, "type": "Airport"}, {"icao": "LFFJ5", "lat": 50.124153, "lon": 3.425247, "type": "Airport"}, {"icao": "LFE6V", "lat": 49.857156, "lon": 3.263714, "type": "Airport"}, {"icao": "WP2", "lat": 49.354664, "lon": 2.991225, "type": "User"}, {"icao": "LFQEM", "lat": 49.3858, "lon": 2.788394, "type": "Airport"}, {"icao": "LFZFO", "lat": 49.135425, "lon": 2.597322, "type": "Airport"}, {"icao": "LFPB", "lat": 48.962276, "lon": 2.436539, "type": "Airport"}], "distance_nm": 149.1, "leg": 2, "date": "2026-10-12", "filename": "Hippy Trail Part 02 VFR Brussels National (EBBR) to Le Bourget (LFPB).pln"}, {"departure": "LFPB", "destination": "LFQE", "waypoints": [{"icao": "LFPB", "lat": 48.962276, "lon": 2.436539, "type": "Airport"}, {"icao": "WP1", "lat": 48.856933, "lon": 2.293914, "type": "User"}, {"icao": "WP2", "lat": 48.860378, "lon": 2.338, "type": "User"}, {"icao": "WP3", "lat": 48.852731, "lon": 2.351764, "type": "User"}, {"icao": "LF3UX", "lat": 48.966056, "lon": 2.8878, "type": "Airport"}, {"icao": "WP4", "lat": 49.261333, "lon": 4.028839, "type": "User"}, {"icao": "LFQMY", "lat": 49.225792, "lon": 4.018514, "type": "Airport"}, {"icao": "LFQA", "lat": 49.208698, "lon": 4.15658, "type": "Airport"}, {"icao": "LFSKQ", "lat": 49.204072, "lon": 4.412256, "type": "Airport"}, {"icao": "WP5", "lat": 49.211864, "lon": 5.424392, "type": "User"}, {"icao": "LFQE", "lat": 49.226898, "lon": 5.67222, "type": "Airport"}], "distance_nm": 148.6, "leg": 3, "date": "2026-10-19", "filename": "Hippy Trail Part 03 VFR Le Bourget (LFPB) to Rouvres Army (LFQE).pln"}, {"departure": "LFQE", "destination": "LKCV", "waypoints": [{"icao": "LFQE", "lat": 49.226898, "lon": 5.67222, "type": "Airport"}, {"icao": "WP1", "lat": 48.792164, "lon": 9.232314, "type": "User"}, {"icao": "EDDS", "lat": 48.689878, "lon": 9.221964, "type": "Airport"}, {"icao": "EDDM", "lat": 48.353783, "lon": 11.786086, "type": "Airport"}, {"icao": "LKBL", "lat": 49.431042, "lon": 13.7968, "type": "Airport"}, {"icao": "WP2", "lat": 49.781739, "lon": 14.671931, "type": "User"}, {"icao": "LKCV", "lat": 49.939701, "lon": 15.3818, "type": "Airport"}], "distance_nm": 424.2, "leg": 4, "date": "2026-10-21", "filename": "Hippy Trail Part 04 VFR Rouvres Army (LFQE) to Caslav (LKCV).pln"}, {"departure": "LKCV", "destination": "EPWA", "waypoints": [{"icao": "LKCV", "lat": 49.939701, "lon": 15.3818, "type": "Airport"}, {"icao": "LKSE", "lat": 50.068028, "lon": 15.812006, "type": "Airport"}, {"icao": "WP1", "lat": 50.081536, "lon": 15.810931, "type": "User"}, {"icao": "EPWO", "lat": 50.783344, "lon": 17.161422, "type": "Airport"}, {"icao": "EPLL", "lat": 51.721942, "lon": 19.398056, "type": "Airport"}, {"icao": "EPWA", "lat": 52.165699, "lon": 20.9671, "type": "Airport"}], "distance_nm": 250.8, "leg": 5, "date": "", "filename": "Hippy Trail Part 5 VFR Caslav (LKCV) to Okecie (EPWA).pln"}];
const ACCENT = '#f6a623';
const LEG_COLORS = ['#f6a623','#e05c2a','#d4a017','#c8813d','#e8b84b','#f0c060','#cc6633','#e07020','#d4883a','#f0a040'];

const map = L.map('map',{zoomControl:true}).setView([50,5],5);
const tileLayers = {
  'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'&copy; Esri',maxZoom:19}),
  'Dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}),
  'Topo': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenTopoMap',maxZoom:17})
};
tileLayers['Satellite'].addTo(map);
L.control.layers(tileLayers,{},{position:'topright'}).addTo(map);

const elevCtx = document.getElementById('elev-chart').getContext('2d');
let elevChart = new Chart(elevCtx,{type:'line',data:{labels:[],datasets:[{label:'Elevation (ft)',data:[],borderColor:ACCENT,backgroundColor:'rgba(246,166,35,0.15)',borderWidth:1.5,pointRadius:0,fill:true,tension:0.3}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{display:false},y:{ticks:{color:'#9ca3af',font:{size:9}},grid:{color:'#1f2937'}}},plugins:{legend:{display:false}}}});

const cardEls = [];
const allBounds = [];

function buildCards() {
  const total = PLANS.reduce((s,p)=>s+p.distance_nm,0);
  document.getElementById('subtitle').textContent = PLANS.length+' legs · '+total.toFixed(1)+' NM total · '+(total/PLANS.length).toFixed(1)+' NM avg · Little Navmap';
  const cards = document.getElementById('cards');
  PLANS.forEach((p,i) => {
    const c = document.createElement('div');
    c.className='leg-card';
    c.innerHTML='<div class="leg-num">Leg '+p.leg+' &middot; '+(p.date||'')+'</div><div class="leg-route">'+p.departure+' &rarr; '+p.destination+'</div><div class="leg-meta">'+p.distance_nm+' NM &middot; '+p.waypoints.length+' waypoints</div>';
    c.onclick=()=>focusLeg(i);
    cards.appendChild(c);
    cardEls.push(c);
  });
}

function drawRoutes() {
  PLANS.forEach((p,i) => {
    const color = LEG_COLORS[i%LEG_COLORS.length];
    const latlngs = p.waypoints.map(w=>[w.lat,w.lon]);
    L.polyline(latlngs,{color,weight:2.5,opacity:0.85}).addTo(map);
    allBounds.push(...latlngs);
    p.waypoints.forEach((wp,wi) => {
      const isEnd = wi===0||wi===p.waypoints.length-1;
      L.circleMarker([wp.lat,wp.lon],{radius:isEnd?7:5,color:isEnd?ACCENT:color,fillColor:isEnd?ACCENT:color,fillOpacity:0.9,weight:2})
        .bindPopup('<div class="popup-icao">'+wp.icao+'</div><div class="popup-detail">Leg '+p.leg+': '+p.departure+' → '+p.destination+'</div><div class="popup-detail">'+wp.lat.toFixed(4)+', '+wp.lon.toFixed(4)+'</div>')
        .addTo(map);
    });
  });
  if (allBounds.length) map.fitBounds(L.latLngBounds(allBounds),{padding:[40,40]});
}

function focusLeg(idx) {
  cardEls.forEach((c,i)=>c.classList.toggle('active',i===idx));
  const p = PLANS[idx];
  map.fitBounds(L.latLngBounds(p.waypoints.map(w=>[w.lat,w.lon])),{padding:[60,60]});
  document.getElementById('elev-title').textContent='Elevation — Leg '+p.leg+': '+p.departure+' → '+p.destination;
  loadElevation(p,idx);
}

async function loadElevation(plan,idx) {
  const pts = sampleRoute(plan.waypoints.map(w=>[w.lat,w.lon]),50);
  try {
    const res=await fetch('https://api.open-meteo.com/v1/elevation?latitude='+pts.map(p=>p[0].toFixed(4)).join(',')+'&longitude='+pts.map(p=>p[1].toFixed(4)).join(','));
    const data=await res.json();
    const elevs=data.elevation.map(e=>Math.round(e*3.28084));
    const color=LEG_COLORS[idx%LEG_COLORS.length];
    elevChart.data.labels=elevs.map((_,i)=>i);
    elevChart.data.datasets[0].data=elevs;
    elevChart.data.datasets[0].borderColor=color;
    elevChart.data.datasets[0].backgroundColor=color.replace('rgb','rgba').replace(')',',0.15)')||color+'26';
    elevChart.update();
  } catch(e){console.warn('Elevation fetch failed',e);}
}

function sampleRoute(ll,n){if(ll.length<=n)return ll;const s=(ll.length-1)/(n-1);return Array.from({length:n},(_,i)=>ll[Math.round(i*s)]);}

buildCards();
drawRoutes();
focusLeg(0);
</script>
</body>
</html>
