const ACCENT = '#3b82f6';
const COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316','#84cc16','#ec4899','#14b8a6','#a855f7','#eab308','#22c55e','#f43f5e','#0ea5e9','#d946ef','#fb923c','#4ade80','#38bdf8','#c084fc'];
const map = L.map('map',{zoomControl:true}).setView([20,0],2);
const tileLayers = {
  'Dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}),

};

const elevCtx = document.getElementById('elev-chart').getContext('2d');

const cardEls = [];
function getFlightLabel(p) {
  const f = p.filename || '';
  let name = f.replace(/\.pln$/i,'').replace(/\.lnmpln$/i,'');
  name = name.replace(/^(RSP[_ ]Group[_ ]?|RSP[_ ]?|VFR[_ ]?|IFR[_ ]?)/i,'').trim();
  name = name.replace(/_/g,' ').trim();
  return name || (p.departure + ' to ' + p.destination);
}
function buildCards() {
  const total = PLANS.reduce((s,p)=>s+p.distance_nm,0);
  document.getElementById('subtitle').textContent = PLANS.length+' flights · '+total.toFixed(1)+' NM total · '+(total/PLANS.length).toFixed(1)+' NM avg · Little Navmap';
  document.getElementById('flight-count').textContent = PLANS.length;
  const cards = document.getElementById('cards');
  PLANS.forEach((p,i) => {
    const color = COLORS[i%COLORS.length];
    const label = getFlightLabel(p);
    const c = document.createElement('div');
    c.className='leg-card';
    c.dataset.search=(p.departure+' '+p.destination+' '+label).toLowerCase();
    c.innerHTML='<div class="leg-dot" style="background:'+color+'"></div><div class="leg-info"><div class="leg-num">Flight '+p.leg+' &middot; '+(p.date||'')+'</div><div class="leg-route">'+p.departure+' &rarr; '+p.destination+'</div><div class="leg-name">'+label+'</div></div><div class="leg-nm">'+p.distance_nm+'<br><span style="font-size:0.65rem;color:#475569">NM</span></div>';
    c.onclick=()=>focusFlight(i);
    cards.appendChild(c);
    cardEls.push(c);
  });
}
function filterCards(q) {
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  let v=0;
  cardEls.forEach(c=>{const show=terms.every(t=>c.dataset.search.includes(t));c.classList.toggle('hidden',!show);if(show)v++;});
  document.getElementById('flight-count').textContent=v+(q?' of '+PLANS.length:'');
}
function drawRoutes() {
  PLANS.forEach((p,i)=>{
    const color=COLORS[i%COLORS.length];
    const ll=p.waypoints.map(w=>[w.lat,w.lon]);
    L.polyline(ll,{color,weight:2.2,opacity:0.75}).addTo(map);
    const label=getFlightLabel(p);
    [p.waypoints[0],p.waypoints[p.waypoints.length-1]].forEach(wp=>{
      L.circleMarker([wp.lat,wp.lon],{radius:5,color,fillColor:color,fillOpacity:0.9,weight:1.5})
        .bindPopup('<div class="popup-icao">'+wp.icao+'</div><div class="popup-detail">'+label+'</div><div class="popup-detail">'+p.distance_nm+' NM &middot; '+p.waypoints.length+' waypoints</div>')

    });
  });
}
function focusFlight(idx) {
  cardEls.forEach((c,i)=>c.classList.toggle('active',i===idx));

  const p=PLANS[idx];
  map.fitBounds(L.latLngBounds(p.waypoints.map(w=>[w.lat,w.lon])),{padding:[60,80]});
  document.getElementById('elev-title').textContent='Elevation — Flight '+p.leg+': '+p.departure+' → '+p.destination;
  loadElevation(p,idx);
}
async function loadElevation(plan,idx) {
  const pts=sampleRoute(plan.waypoints.map(w=>[w.lat,w.lon]),50);
  try {
    const res=await fetch('https://api.open-meteo.com/v1/elevation?latitude='+pts.map(p=>p[0].toFixed(4)).join(',')+'&longitude='+pts.map(p=>p[1].toFixed(4)).join(','));
    const data=await res.json();
    const elevs=data.elevation.map(e=>Math.round(e*3.28084));
    const color=COLORS[idx%COLORS.length];
    elevChart.data.labels=elevs.map((_,i)=>i);
    elevChart.data.datasets[0].data=elevs;
    elevChart.data.datasets[0].borderColor=color;
    elevChart.data.datasets[0].backgroundColor=color+'20';
    elevChart.update();
  } catch(e){console.warn('Elevation fetch failed',e);}
}
function sampleRoute(ll,n){if(ll.length<=n)return ll;const s=(ll.length-1)/(n-1);return Array.from({length:n},(_,i)=>ll[Math.round(i*s)]);}

drawRoutes();
focusFlight(PLANS.length-1);
