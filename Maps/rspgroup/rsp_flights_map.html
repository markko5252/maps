<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }
  #header { background: linear-gradient(135deg, #1a2332 0%, #0d1117 100%); border-bottom: 1px solid #30363d; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  #header h1 { font-size: 1.2rem; font-weight: 700; color: #58a6ff; letter-spacing: 0.5px; }
  #header .subtitle { font-size: 0.78rem; color: #8b949e; margin-top: 2px; }
  #stats { display: flex; gap: 20px; align-items: center; }
  .stat { text-align: center; }
  .stat-val { font-size: 1.3rem; font-weight: 700; color: #58a6ff; }
  .stat-lbl { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
  #map-controls { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 6px; }
  .map-btn { background: rgba(13,17,23,0.92); border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; padding: 7px 12px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; font-family: 'Segoe UI', Arial, sans-serif; }
  .map-btn:hover { background: #1f2937; border-color: #58a6ff; }
  .map-btn.active { background: #1c2d3f; border-color: #58a6ff; color: #58a6ff; }
  #main { display: flex; flex: 1; min-height: 0; position: relative; }
  #sidebar { width: 280px; min-width: 220px; background: #161b22; border-right: 1px solid #30363d; overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
  #sidebar h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #8b949e; padding: 12px 14px 6px; border-bottom: 1px solid #21262d; flex-shrink: 0; }
  #leg-list { flex: 1; overflow-y: auto; }
  .leg-item { padding: 9px 14px; border-bottom: 1px solid #21262d; cursor: pointer; transition: background 0.15s; display: flex; align-items: flex-start; gap: 10px; }
  .leg-item:hover { background: #1f2937; }
  .leg-item.active { background: #1c2d3f; border-left: 3px solid var(--leg-color); }
  .leg-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--leg-color); margin-top: 3px; flex-shrink: 0; }
  .leg-info { flex: 1; min-width: 0; }
  .leg-part { font-size: 0.62rem; color: #8b949e; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .leg-route { font-size: 0.82rem; font-weight: 600; color: #e6edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .leg-meta { font-size: 0.7rem; color: #8b949e; margin-top: 2px; }
  #map { flex: 1; }
  #elev-panel { position: absolute; bottom: 0; left: 280px; right: 0; z-index: 900; background: rgba(13,17,23,0.96); border-top: 1px solid #30363d; height: 180px; display: none; flex-direction: column; padding: 10px 16px 8px; }
  #elev-panel.visible { display: flex; }
  #elev-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #elev-title { font-size: 0.75rem; font-weight: 600; color: #58a6ff; }
  #elev-status { font-size: 0.68rem; color: #8b949e; }
  #elev-close { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 4px; }
  #elev-close:hover { color: #e6edf3; }
  #elev-chart-wrap { flex: 1; position: relative; }
  .flight-tooltip { background: rgba(13,17,23,0.95) !important; border: 1px solid #30363d !important; border-radius: 8px !important; padding: 0 !important; box-shadow: 0 8px 24px rgba(0,0,0,0.5) !important; color: #e6edf3 !important; font-family: 'Segoe UI', Arial, sans-serif !important; min-width: 220px; }
  .flight-tooltip::before { display: none !important; }
  .tt-header { padding: 10px 14px 8px; border-radius: 8px 8px 0 0; font-weight: 700; font-size: 0.85rem; border-bottom: 1px solid #30363d; }
  .tt-body { padding: 8px 14px 10px; }
  .tt-row { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 4px; font-size: 0.77rem; }
  .tt-label { color: #8b949e; }
  .tt-value { color: #e6edf3; font-weight: 600; text-align: right; }
  .tt-file { font-size: 0.65rem; color: #6e7681; margin-top: 6px; word-break: break-all; }
  #legend { position: absolute; bottom: 20px; left: 10px; z-index: 1000; background: rgba(13,17,23,0.92); border: 1px solid #30363d; border-radius: 8px; padding: 10px 14px; font-size: 0.7rem; max-width: 210px; }
  #legend h3 { color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-size: 0.65rem; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: #e6edf3; }
  .legend-dot-dep { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; border: 2px solid #fff; flex-shrink:0; }
  .legend-dot-arr { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; border: 2px solid #fff; flex-shrink:0; }
  .legend-dot-wp  { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.6); flex-shrink:0; }
</style>

const map=L.map('map',{center:[20,10],zoom:2,preferCanvas:true});
const layers={
  dark:      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}),

};
layers.dark.addTo(map);
let currentLayer='dark';
function setLayer(name){
  if(currentLayer===name) return;
  map.removeLayer(layers[currentLayer]); layers[name].addTo(map); currentLayer=name;
  document.querySelectorAll('.map-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+name).classList.add('active');
}

let elevChart=null, elevCache={};
function closeElev(){ document.getElementById('elev-panel').classList.remove('visible'); }
async function loadElevation(plan,color){
  const panel=document.getElementById('elev-panel'), status=document.getElementById('elev-status'), title=document.getElementById('elev-title');
  panel.classList.add('visible');
  title.textContent=`Elevation Profile — ${plan.location}: ${plan.departure} → ${plan.destination}`;
  status.textContent='Loading…';
  const wps=plan.waypoints, step=Math.max(1,Math.floor(wps.length/40)), sampled=[];
  for(let i=0;i<wps.length;i+=step) sampled.push(wps[i]);
  if(sampled[sampled.length-1]!==wps[wps.length-1]) sampled.push(wps[wps.length-1]);
  let elevData;
  if(elevCache[plan.part]){ elevData=elevCache[plan.part]; status.textContent=`${sampled.length} samples`; }
  else {
    try {
      const resp=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${sampled.map(p=>p[0]).join(',')}&longitude=${sampled.map(p=>p[1]).join(',')}`);
      const json=await resp.json(); elevData=json.elevation||[];
      elevCache[plan.part]=elevData; status.textContent=`${elevData.length} samples`;
    } catch(e){ status.textContent='Elevation data unavailable'; elevData=sampled.map(()=>0); }
  }
  function hav(a,b,c,d){const R=3440.065,t=Math.PI/180,e=(c-a)*t,f=(d-b)*t,g=Math.sin(e/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(f/2)**2;return R*2*Math.atan2(Math.sqrt(g),Math.sqrt(1-g));}
  let cum=0;
  const labels=sampled.map((wp,i)=>{if(i>0)cum+=hav(sampled[i-1][0],sampled[i-1][1],wp[0],wp[1]);return cum.toFixed(1);});
  if(elevChart) elevChart.destroy();
  elevChart=new Chart(document.getElementById('elev-chart').getContext('2d'),{
    type:'line',
    data:{labels,datasets:[{data:elevData.map(e=>Math.round(e*3.28084)),borderColor:color,backgroundColor:color+'33',borderWidth:2,pointRadius:0,fill:true,tension:0.3}]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:400},
      plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>`${c[0].label} NM`,label:c=>`${c.parsed.y.toLocaleString()} ft`},backgroundColor:'rgba(13,17,23,0.95)',borderColor:'#30363d',borderWidth:1,titleColor:'#8b949e',bodyColor:'#e6edf3'}},
      scales:{x:{title:{display:true,text:'Distance (NM)',color:'#8b949e',font:{size:10}},ticks:{color:'#8b949e',font:{size:9},maxTicksLimit:10},grid:{color:'#21262d'}},
              y:{title:{display:true,text:'Elevation (ft)',color:'#8b949e',font:{size:10}},ticks:{color:'#8b949e',font:{size:9},callback:v=>v.toLocaleString()},grid:{color:'#21262d'},min:0}}}
  });
}

const legList=document.getElementById('leg-list');
let activeLeg=null;
function buildTooltip(plan,color){
  return `<div class="tt-header" style="background:linear-gradient(135deg,${color}22,${color}11)"><span style="color:${color}">#${String(plan.part).padStart(2,'0')}</span> &nbsp;·&nbsp; ${plan.location}</div>
  <div class="tt-body">
    <div class="tt-row"><span class="tt-label">Date</span><span class="tt-value">${plan.date}</span></div>
    <div class="tt-row"><span class="tt-label">Departure</span><span class="tt-value">${plan.departure}</span></div>
    <div class="tt-row"><span class="tt-label">Arrival</span><span class="tt-value">${plan.destination}</span></div>
    <div class="tt-row"><span class="tt-label">Distance</span><span class="tt-value">${plan.distance_nm>0?plan.distance_nm.toLocaleString()+' NM':'N/A'}</span></div>
    <div class="tt-row"><span class="tt-label">Waypoints</span><span class="tt-value">${plan.waypoints.length}</span></div>
    <div class="tt-file">${plan.filename}</div>
  </div>`;
}
function focusLeg(idx){
  if(activeLeg!==null&&PLANS[activeLeg]._poly) PLANS[activeLeg]._poly.setStyle({weight:3,opacity:0.85});
  if(activeLeg!==null) PLANS[activeLeg]._sidebarEl.classList.remove('active');
  activeLeg=idx;
  const plan=PLANS[idx];
  if(plan._poly){plan._poly.setStyle({weight:5,opacity:1});plan._poly.bringToFront();map.fitBounds(plan._poly.getBounds().pad(0.3));loadElevation(plan,plan._color);}
  plan._sidebarEl.classList.add('active');
  plan._sidebarEl.scrollIntoView({behavior:'smooth',block:'nearest'});
}
PLANS.forEach((plan,idx)=>{
  const color=COLORS[idx%COLORS.length]; plan._color=color;
  const item=document.createElement('div'); item.className='leg-item'; item.style.setProperty('--leg-color',color);
  item.innerHTML=`<div class="leg-dot"></div><div class="leg-info"><div class="leg-part">#${String(plan.part).padStart(2,'0')} · ${plan.date}</div><div class="leg-route">${plan.location}</div><div class="leg-meta">${plan.departure} → ${plan.destination} &nbsp;·&nbsp; ${plan.distance_nm} NM</div></div>`;
  item.addEventListener('click',()=>focusLeg(idx)); legList.appendChild(item); plan._sidebarEl=item;
  if(plan.waypoints.length<2) return;
  const latlngs=plan.waypoints.map(w=>[w[0],w[1]]), ttHtml=buildTooltip(plan,color);
  const poly=L.polyline(latlngs,{color,weight:3,opacity:0.85,smoothFactor:1.5}).addTo(map);
  poly.bindTooltip(ttHtml,{sticky:true,className:'flight-tooltip',offset:[15,0],opacity:1});
  poly.on('mouseover',function(){this.setStyle({weight:5,opacity:1});});
  poly.on('mouseout', function(){this.setStyle({weight:activeLeg===idx?5:3,opacity:activeLeg===idx?1:0.85});});
  poly.on('click',()=>focusLeg(idx)); plan._poly=poly;
  for(let i=1;i<latlngs.length-1;i++) L.circleMarker(latlngs[i],{radius:3,color,fillColor:'#fff',fillOpacity:0.6,weight:1.5}).addTo(map).bindTooltip(ttHtml,{sticky:true,className:'flight-tooltip',opacity:1});
  L.circleMarker(latlngs[0],{radius:7,color:'#fff',fillColor:'#22c55e',fillOpacity:1,weight:2}).addTo(map).bindTooltip(`<b style="color:#22c55e">DEP</b> ${plan.departure}`,{className:'flight-tooltip',sticky:true,opacity:1});
  L.circleMarker(latlngs[latlngs.length-1],{radius:7,color:'#fff',fillColor:'#ef4444',fillOpacity:1,weight:2}).addTo(map).bindTooltip(`<b style="color:#ef4444">ARR</b> ${plan.destination}`,{className:'flight-tooltip',sticky:true,opacity:1});
  const mid=latlngs[Math.floor(latlngs.length/2)];
  L.marker(mid,{icon:L.divIcon({html:`<div style="background:${color};color:#000;font-size:9px;font-weight:800;border-radius:10px;padding:1px 5px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,0.6)">${plan.part}</div>`,className:'',iconAnchor:[10,8]}),interactive:false}).addTo(map);
});
const lc=L.control({position:'bottomleft'});
lc.onAdd=function(){const d=L.DomUtil.create('div','');d.id='legend';d.innerHTML=`<h3>Map Legend</h3><div class="legend-row"><div class="legend-dot-dep"></div> Departure</div><div class="legend-row"><div class="legend-dot-arr"></div> Arrival</div><div class="legend-row"><div class="legend-dot-wp"></div> Waypoint</div><div class="legend-row" style="margin-top:8px"><div style="width:24px;height:3px;border-radius:2px;background:linear-gradient(90deg,#FF6B6B,#3498DB,#22c55e)"></div> Route Lines</div><div class="legend-row" style="margin-top:6px;font-size:0.65rem;color:#8b949e">Click a flight for elevation profile</div>`;return d;};
lc.addTo(map);
</script>
