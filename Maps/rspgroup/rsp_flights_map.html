const ACCENT = '#3b82f6';
const COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6',
  '#06b6d4','#f97316','#84cc16','#ec4899','#14b8a6',
  '#a855f7','#eab308','#22c55e','#f43f5e','#0ea5e9'];

const map = L.map('map',{zoomControl:true}).setView([20,0],2);
const layers = {
  'Dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}),
  'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {attribution:'&copy; Esri',maxZoom:19}),
  'Topo': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    {attribution:'&copy; OpenTopoMap',maxZoom:17})
};
layers['Dark'].addTo(map);
L.control.layers(layers,{},{position:'topright'}).addTo(map);

const elevCtx = document.getElementById('elev-chart').getContext('2d');
let elevChart = new Chart(elevCtx,{
  type:'line',
  data:{labels:[],datasets:[{label:'Elevation (ft)',data:[],borderColor:ACCENT,
    backgroundColor:'rgba(59,130,246,0.15)',borderWidth:1.5,pointRadius:0,fill:true,tension:0.3}]},
  options:{responsive:true,maintainAspectRatio:false,
    scales:{x:{display:false},y:{ticks:{color:'#9ca3af',font:{size:9}},grid:{color:'#1f2937'}}},
    plugins:{legend:{display:false}}}
});

function buildCards() {
  const total = PLANS.reduce((s,p)=>s+p.distance_nm,0);
  document.getElementById('subtitle').textContent =
    `${PLANS.length} flights · ${total.toFixed(1)} NM total · ${(total/PLANS.length).toFixed(1)} NM avg · Little Navmap`;
  const cards = document.getElementById('cards');
  PLANS.forEach((p,i) => {
    const c = document.createElement('div');
    c.className='leg-card';
    c.innerHTML=`<div class="leg-num">Flight ${p.leg} · ${p.date||''}</div>
      <div class="leg-route">${p.departure} → ${p.destination}</div>
      <div class="leg-meta">${p.distance_nm} NM · ${p.waypoints.length} waypoints</div>`;
    c.onclick=()=>focusFlight(i);
    cards.appendChild(c);
  });
}

function drawRoutes() {
  PLANS.forEach((p,i) => {
    const color = COLORS[i % COLORS.length];
    const latlngs = p.waypoints.map(w=>[w.lat,w.lon]);
    L.polyline(latlngs,{color,weight:2.5,opacity:0.8}).addTo(map);
    [p.waypoints[0], p.waypoints[p.waypoints.length-1]].forEach((wp,wi) => {
      L.circleMarker([wp.lat,wp.lon],{radius:6,color:color,fillColor:color,fillOpacity:0.9,weight:2})
        .bindPopup(`<div class="popup-icao">${wp.icao}</div>
          <div class="popup-detail">Flight ${p.leg}: ${p.departure} → ${p.destination}</div>
          <div class="popup-detail">${p.distance_nm} NM</div>`)
        .addTo(map);
    });
  });
}

function focusFlight(idx) {
  document.querySelectorAll('.leg-card').forEach((c,i)=>c.classList.toggle('active',i===idx));
  const p = PLANS[idx];
  const latlngs = p.waypoints.map(w=>[w.lat,w.lon]);
  map.fitBounds(L.latLngBounds(latlngs),{padding:[60,60]});
  document.getElementById('elev-title').textContent =
    `Elevation — Flight ${p.leg}: ${p.departure} → ${p.destination}`;
  loadElevation(p, idx);
}

async function loadElevation(plan, idx) {
  const latlngs = plan.waypoints.map(w=>[w.lat,w.lon]);
  const pts = sampleRoute(latlngs, 50);
  try {
    const url = `https://api.open-meteo.com/v1/elevation?latitude=${pts.map(p=>p[0].toFixed(4)).join(',')}&longitude=${pts.map(p=>p[1].toFixed(4)).join(',')}`;
    const res = await fetch(url);
    const data = await res.json();
    const elevs = data.elevation.map(e=>Math.round(e*3.28084));
    const color = COLORS[idx % COLORS.length];
    elevChart.data.labels = elevs.map((_,i)=>i);
    elevChart.data.datasets[0].data = elevs;
    elevChart.data.datasets[0].borderColor = color;
    elevChart.data.datasets[0].backgroundColor = color+'26';
    elevChart.update();
  } catch(e) { console.warn('Elevation fetch failed',e); }
}

function sampleRoute(latlngs,n) {
  if(latlngs.length<=n) return latlngs;
  const step=(latlngs.length-1)/(n-1);
  return Array.from({length:n},(_,i)=>latlngs[Math.round(i*step)]);
}

buildCards();
drawRoutes();
focusFlight(PLANS.length-1);
</script>
